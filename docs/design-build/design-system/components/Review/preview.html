<!doctype html><html><body class="hu-body" style="margin:0;padding:32px">
<div class="hu-review">
  <div class="hu-review__head"><span class="hu-stars" aria-label="5 out of 5 stars">★★★★★</span><span class="hu-mono">5.0 on Google · [count] reviews</span></div>
  <blockquote><p style="margin:0">[A real Google review, copied word for word]</p></blockquote>
  <a class="hu-pill hu-pill--ghost" href="#">Read all reviews on Google</a>
</div>
<script>document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.preventDefault()))</script>
</body></html>
